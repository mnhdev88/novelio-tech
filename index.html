<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B3172" />

    <!-- Preconnect: fonts (highest priority — must be before stylesheet request) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload critical font files so browser fetches them immediately -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" /></noscript>

    <!-- Preconnect: analytics (non-render-blocking) -->
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://www.clarity.ms" />
    <link rel="preconnect" href="https://s3-us-west-2.amazonaws.com" />

    <!-- Title, description, canonical, Open Graph & Twitter tags are injected per-route
         by react-helmet-async (see src/components/SEO.jsx) and baked into each page by
         the prerender step (scripts/prerender.mjs). They are intentionally NOT hard-coded
         here — duplicating them would produce two of every tag on every prerendered page. -->

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Analytics loaded during idle time after TTI — minimises TBT impact -->
    <script>
      function _loadAnalytics() {
        // Microsoft Clarity
        (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "wqm0zhchpy");

        // Google Analytics
        var s=document.createElement('script');
        s.async=true;
        s.src='https://www.googletagmanager.com/gtag/js?id=G-D2VRR8SWH2';
        document.head.appendChild(s);
        window.dataLayer=window.dataLayer||[];
        function gtag(){dataLayer.push(arguments);}
        gtag('js',new Date());
        gtag('config','G-D2VRR8SWH2');
      }
      if ('requestIdleCallback' in window) {
        requestIdleCallback(_loadAnalytics, { timeout: 4000 });
      } else {
        window.addEventListener('load', function() { setTimeout(_loadAnalytics, 1000); });
      }
    </script>
