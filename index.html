<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B3172" />

    <!-- Self-hosted fonts: preload the latin woff2 files so they fetch immediately.
         @font-face rules live in src/index.css. No fonts.gstatic.com dependency. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/space-grotesk-latin.woff2" crossorigin />

    <!-- Preconnect: analytics (non-render-blocking) -->
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://www.clarity.ms" />

    <!-- Title, description, canonical, Open Graph & Twitter tags are injected per-route
         by react-helmet-async (see src/components/SEO.jsx) and baked into each page by
         the prerender step (scripts/prerender.mjs). They are intentionally NOT hard-coded
         here — duplicating them would produce two of every tag on every prerendered page. -->

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Schema: WebSite -->

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Analytics loaded during idle time after TTI — minimises TBT impact -->
    <script>
      function _loadAnalytics() {
        // Microsoft Clarity
        (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "wqm0zhchpy");

        // Google Analytics
        var s=document.createElement('script');
        s.async=true;
        s.src='https://www.googletagmanager.com/gtag/js?id=G-D2VRR8SWH2';
        document.head.appendChild(s);
        window.gtag('js',new Date());
        window.gtag('config','G-D2VRR8SWH2');
      }
      // Define dataLayer + a global gtag immediately so custom events fired by the
      // app (see src/utils/analytics.js) are queued even before the GA tag loads.
      // The queued calls flush automatically once gtag/js is appended above.
      window.dataLayer = window.dataLayer || [];
      window.gtag = window.gtag || function(){ window.dataLayer.push(arguments); };
      // Skip analytics for crawlers/bots so their beacons don't pollute
      // analytics data or surface as resource errors in Search Console.
      var _isBot = /bot|crawl|spider|google|bing|yandex|duckduck|baidu|slurp|lighthouse|headless|prerender|chrome-lighthouse/i.test(navigator.userAgent);
      if (!_isBot) {
        if ('requestIdleCallback' in window) {
          requestIdleCallback(_loadAnalytics, { timeout: 4000 });
        } else {
          window.addEventListener('load', function() { setTimeout(_loadAnalytics, 1000); });
        }
      }
    </script>
  </body>
</html>
