name: Build & Deploy to Hostinger

# Why this exists: Hostinger shared hosting can't run puppeteer/Chromium, so the
# SEO prerender step can't run on the server. Instead we prerender here on GitHub's
# runners (Chromium works) and upload the finished static dist/ to Hostinger over FTPS.
# Source of truth stays the React app in src/; nothing built is committed to git.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  # false: never cancel a running deploy mid-FTP-upload (that leaves the server
  # sync in a bad state). Queued pushes wait and run in order instead.
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Installs deps and (via puppeteer's postinstall) downloads Chrome-for-Testing.
      # ubuntu-latest already ships Chrome's shared libraries, so the browser launches.
      - name: Install dependencies
        run: npm ci

      # vite build copies public/ (incl. .htaccess + sitemap.xml) into dist/, then
      # prerender.mjs renders every sitemap route to dist/<route>/index.html.
      # If Chromium ever fails to launch, set PUPPETEER_EXECUTABLE_PATH below to
      # /usr/bin/google-chrome (preinstalled on the runner).
      - name: Build + prerender
        run: npm run build:prerender
        env:
          # PUBLIC PayPal client id — safe to commit (it's sent to every browser).
          # Baked in directly so the build no longer depends on a GitHub secret.
          # Vite inlines VITE_* vars at build time. To go back to sandbox, change
          # these two values (client id + 'sandbox') and push.
          VITE_PAYPAL_CLIENT_ID: AQDadamNsJxxUrmtABEFN6k7n2JF88aJcqOYVFq3WBvebApo7wQElW0mIPCKQnM9MMyqDRPv8Vmrhxmo
          VITE_PAYPAL_ENV: live

      - name: Deploy dist/ to Hostinger over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # Non-secret and error-prone as inputs, so baked in directly:
          #  - server is the Hostinger FTP IP (public via DNS), NO ftp:// prefix.
          #  - server-dir MUST end with a trailing slash or the action fails.
          # Only username + password stay as encrypted GitHub secrets.
          server: 145.223.104.32
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: public_html/
          # Protect Hostinger-managed paths from the sync's delete step.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
            cgi-bin/**
            .htpasswd
            # Local-dev PayPal secret — must never reach the server (prod uses the
            # credentials file ABOVE public_html). Blocked by api/.htaccess too.
            **/credentials.local.php

      # Tell IndexNow engines (Bing, Yandex, Seznam, …) to re-crawl the live URLs.
      # Runs only after a successful FTPS deploy so the key file + pages are already live.
      - name: Ping IndexNow
        run: npm run indexnow
